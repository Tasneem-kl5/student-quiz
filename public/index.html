<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main class="quiz-card">
        <h1>Student Quiz</h1>
        <p>Five quick maths questions. Take your time and choose your answers.</p>
        <label for="studentName">Your name</label>

        <input type="text" id="studentName" placeholder="e.g. tasneem" autocomplete="given-name">
        <button id="startButton">Start Quiz</button>
        <div id="questionsContainer"></div>
        <button id="submitButton">submit answers</button>

        <div id="resultContainer"></div>
        <button id="restartButton" hidden>Restart Quiz</button>
    </main>
    <script src="script.js"></script>



</body>

</html>
